[project]
name = "telegram-bitable-work-agent-backend"
version = "0.1.0"
description = "Stage 02 backend kernel for Telegram Bitable work agents."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.110",
    "httpx>=0.27",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pytest>=8.2",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "-p", "no:deepeval", "-ra"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "postgres: requires the authorised disposable local PostgreSQL target",
]
