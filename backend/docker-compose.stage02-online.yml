services:
  stage02-online-postgres:
    image: pgvector/pgvector:pg16
    container_name: stage02-online-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stage02_online_test
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stage02_online_test"]
      interval: 5s
      timeout: 3s
      retries: 20
