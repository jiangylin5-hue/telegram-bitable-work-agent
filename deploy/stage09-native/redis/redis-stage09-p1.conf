# Native P1 Redis configuration: private Unix socket only, no TCP listener.
protected-mode yes
port 0
unixsocket /run/stage09-p1/redis.sock
unixsocketperm 770
dir /var/lib/redis-stage09-p1
dbfilename dump.rdb
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
save 900 1
save 300 10
save 60 10000
