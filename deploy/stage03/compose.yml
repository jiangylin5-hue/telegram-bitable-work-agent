name: telegram-bitable-stage03

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - path: ${STAGE03_ENV_FILE:-.env.stage03}
        required: false
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      TELEGRAM_SEND_MODE: dry_run
      LLM_ENABLED: "false"
      PROVIDER_MODE: disabled
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ${STAGE03_ENV_FILE:-.env.stage03}
        required: false
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      TELEGRAM_SEND_MODE: dry_run
      LLM_ENABLED: "false"
      PROVIDER_MODE: disabled
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-bridge:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ${STAGE03_ENV_FILE:-.env.stage03}
        required: false
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      TELEGRAM_SEND_MODE: dry_run
      LLM_ENABLED: "false"
      PROVIDER_MODE: disabled
    command: ["python", "-m", "app.workers.stage03_outbox_bridge_runtime"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ${STAGE03_ENV_FILE:-.env.stage03}
        required: false
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      TELEGRAM_SEND_MODE: dry_run
      LLM_ENABLED: "false"
      PROVIDER_MODE: disabled
    command: ["python", "-m", "app.workers.stage03_runtime"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STAGE03_DOMAIN: ${STAGE03_DOMAIN:?set STAGE03_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
